services:
  logger_gateway:
    build:
      context: ../logger_gateway
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./workers.txt:/docker/workers.txt:ro
      - ./gateway.yaml:/app/config/gateway.yaml
    environment:
      - WORKERS_FILE=/docker/workers.txt
      - RUST_LOG=${RUST_LOG:-info,logger_gateway=debug}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
    networks:
      - logger_network
    depends_on:
      - validation_worker

  validation_worker:
    build:
      context: ../validation_worker
    deploy:
      replicas: 2
    environment:
      - KAFKA_BROKERS=broker:9094
      - PORT=8000 
    networks:
      - logger_network
    depends_on:
      - broker

  broker:
    image: apache/kafka:4.3.0
    container_name: logging_backend_broker
    hostname: broker
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_BROKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_BROKER://broker:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: 4L62xNx5ScCm95V306Y2tQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks:
      - logger_network

  fluent-bit:
    image: fluent/fluent-bit:latest
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - broker
      - opensearch
    networks:
      - logger_network

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - logger_network
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - logger_network
    depends_on:
      - opensearch

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "127.0.0.1:1234:8080"
    depends_on:
      - broker
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:9094
    networks:
      - logger_network

networks:
  logger_network:
    driver: bridge

volumes:
  opensearch-data:
