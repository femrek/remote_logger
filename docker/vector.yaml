sources:
  kafka_in:
    type: kafka
    bootstrap_servers: "redpanda:9092"
    group_id: "vector_group"
    topics:
      - "mobile-logs"

sinks:
  opensearch_out:
    type: opensearch
    inputs:
      - kafka_in
    endpoints:
      - "http://opensearch:9200"
    # Using the standard vector default index pattern, adjust as needed
    index: "mobile-logs-%Y-%m-%d"
    mode: "bulk"
