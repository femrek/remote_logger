services:
  logger_gateway:
    build:
      context: ../logger_gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "127.0.0.1:9095:9090"  # Prometheus metrics (mapped to 9095 to avoid conflict with IDE plugin)
    volumes:
      - ../logger_gateway:/usr/src/logger_gateway
    develop:
      watch:
        - path: ../logger_gateway/src
          action: rebuild
        - path: ../logger_gateway/Cargo.toml
          action: rebuild
        - path: ../logger_gateway/Cargo.lock
          action: rebuild

  logger_admin:
    build:
      context: ../logger_admin
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ../logger_admin:/usr/src/logger_admin
    develop:
      watch:
        - path: ../logger_admin/src
          action: rebuild
        - path: ../logger_admin/Cargo.toml
          action: rebuild
        - path: ../logger_admin/Cargo.lock
          action: rebuild

  auth_worker:
    build:
      context: ../auth_worker
    volumes:
      - ../auth_worker:/usr/src/auth_worker
    develop:
      watch:
        - path: ../auth_worker/src
          action: rebuild
        - path: ../auth_worker/Cargo.toml
          action: rebuild
        - path: ../auth_worker/Cargo.lock
          action: rebuild

  validation_worker:
    build:
      context: ../validation_worker
    volumes:
      - ../validation_worker:/usr/src/validation_worker
    develop:
      watch:
        - path: ../validation_worker/src
          action: rebuild
        - path: ../validation_worker/Cargo.toml
          action: rebuild
        - path: ../validation_worker/Cargo.lock
          action: rebuild

  opensearch:
    ports:
      - "9200:9200"

  opensearch-dashboards:
    ports:
      - "5601:5601"

  kafka-ui:
    ports:
      - "127.0.0.1:1234:8080"

  prometheus:
    ports:
      - "127.0.0.1:9091:9090"  # host:9091 → container:9090 (avoids conflict with gateway)

  grafana:
    ports:
      - "3000:3000"

  consul:
    ports:
      - "8500:8500"
