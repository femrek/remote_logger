channels:
  # ── Production channel ────────────────────────────────────────────────────────
  # validate_attestation: true requires real vendor credentials.
  # require_apple_key_hash: true forces iOS clients to supply device_public_key
  # so the refresh JWT can carry an apk_hash for stateless device binding.
  - id: "example-app-prod"
    app_id: "dev.femrek.exampleapp"
    validate_attestation: true
    google_project_number: "1234567890"
    apple_team_id: "STUBTEAMID"
    require_apple_key_hash: true

  # ── Local development / CI channel ────────────────────────────────────────────
  # Attestation is disabled (validate_attestation: false) so tests and
  # simulators can exchange tokens without real Play Integrity / App Attest.
  # require_apple_key_hash: false so iOS simulator builds don't need a key.
  - id: "example-app-dev"
    app_id: "dev.femrek.exampleapp.dev"
    validate_attestation: false
    require_apple_key_hash: false
