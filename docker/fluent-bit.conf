[SERVICE]
    # How often (in seconds) Fluent Bit takes the accumulated logs and triggers a bulk POST.
    # A value of 2-5 seconds is ideal for high-throughput buffering.
    Flush         2
    Log_Level     info
    Daemon        off
    # Enable internal HTTP server for metrics/monitoring
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          kafka
    Brokers       broker:9094
    Topics        mobile-logs
    Group_Id      fluentbit-ingestion-group
    # Tells Fluent Bit to automatically parse the raw Kafka byte payload as structured JSON
    Format        json

[FILTER]
    Name          nest
    Match         *
    Operation     lift
    Nested_under  payload

[OUTPUT]
    Name          opensearch
    Match         *
    # Point to the OpenSearch container on your internal Docker network
    Host          opensearch
    Port          9200
    
    # Target index name dynamically based on log payload
    Logstash_Format     On
    Logstash_Prefix_Key  log_index_prefix
    
    # CRITICAL: Required for OpenSearch 2.x+. It removes legacy Elasticsearch mapping types.
    Suppress_Type_Name On
    
    # Set to 'create' (rather than 'update'). This optimizes the bulk API for append-only logs, 
    # preventing OpenSearch from wasting CPU checking if the document already exists.
    Write_Operation create
    
    # Ensure TLS is off since we are routing within a secure local Docker bridge network
    tls           Off

    # --- ADVANCED BULK OPTIONS (Optional) ---
    # If your log volume is massive, you can uncomment these to strictly control 
    # the maximum HTTP payload size of a single bulk POST request.
    # Buffer_Size   5M
