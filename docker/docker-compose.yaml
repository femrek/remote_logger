services:
  logger_gateway:
    image: ghcr.io/femrek/logger_gateway:latest
    volumes:
      - ./workers.txt:/docker/workers.txt:ro
      - ./gateway.yaml:/app/config/gateway.yaml:ro
    environment:
      - WORKERS_FILE=/docker/workers.txt
      - RUST_LOG=${RUST_LOG:-info,logger_gateway=debug}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
    networks:
      - logger_network
    depends_on:
      - validation_worker_1
      - validation_worker_2

  validation_worker_1:
    image: ghcr.io/femrek/validation_worker:latest
    volumes:
      - ./channels.yaml:/app/config/channels.yaml:ro
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-broker:9094}
      - PORT=${PORT:-8000}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-mobile-logs}
      - KAFKA_METADATA_TOPIC=${KAFKA_METADATA_TOPIC:-device-metadata}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
      - ACCESS_JWT_TTL_SECONDS=${ACCESS_JWT_TTL_SECONDS:-900}
      - REFRESH_JWT_TTL_SECONDS=${REFRESH_JWT_TTL_SECONDS:-604800}
      - JWT_ISSUER=${JWT_ISSUER:-logger-gateway}
      - WORKER_CONFIG=${WORKER_CONFIG:-/app/config/channels.yaml}
      - RUST_LOG=${RUST_LOG:-info,validation_worker=debug}
      - METRICS_PORT=9091
    networks:
      - logger_network
    depends_on:
      - broker

  validation_worker_2:
    image: ghcr.io/femrek/validation_worker:latest
    volumes:
      - ./channels.yaml:/app/config/channels.yaml:ro
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-broker:9094}
      - PORT=${PORT:-8000}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-mobile-logs}
      - KAFKA_METADATA_TOPIC=${KAFKA_METADATA_TOPIC:-device-metadata}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
      - ACCESS_JWT_TTL_SECONDS=${ACCESS_JWT_TTL_SECONDS:-900}
      - REFRESH_JWT_TTL_SECONDS=${REFRESH_JWT_TTL_SECONDS:-604800}
      - JWT_ISSUER=${JWT_ISSUER:-logger-gateway}
      - WORKER_CONFIG=${WORKER_CONFIG:-/app/config/channels.yaml}
      - RUST_LOG=${RUST_LOG:-info,validation_worker=debug}
      - METRICS_PORT=9091
    networks:
      - logger_network
    depends_on:
      - broker

  broker:
    image: apache/kafka:4.3.0
    container_name: logging_backend_broker
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_BROKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_BROKER://broker:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: 4L62xNx5ScCm95V306Y2tQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks:
      - logger_network

  fluent-bit:
    image: fluent/fluent-bit:latest
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    environment:
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    depends_on:
      - broker
      - opensearch
    networks:
      - logger_network

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - plugins.security.ssl.http.enabled=false
      - plugins.security.ssl.transport.enabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - logger_network
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-u", "admin:${OPENSEARCH_ADMIN_PASSWORD}", "-s", "-f", "http://localhost:9200/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    networks:
      - logger_network
    depends_on:
      - opensearch

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - broker
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:9094
    networks:
      - logger_network

  # ── Monitoring stack ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: logging_backend_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - logger_network
    depends_on:
      - logger_gateway
      - validation_worker_1
      - validation_worker_2
      - kafka-exporter
      - opensearch-exporter

  grafana:
    image: grafana/grafana:11.0.0
    container_name: logging_backend_grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    networks:
      - logger_network
    depends_on:
      - prometheus

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: logging_backend_kafka_exporter
    command:
      - '--kafka.server=broker:9094'
    networks:
      - logger_network
    depends_on:
      broker:
        condition: service_healthy

  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: logging_backend_opensearch_exporter
    command:
      - '--es.uri=http://admin:${OPENSEARCH_ADMIN_PASSWORD}@opensearch:9200'
      - '--es.all'
      - '--es.indices'
    networks:
      - logger_network
    depends_on:
      opensearch:
        condition: service_healthy

networks:
  logger_network:
    driver: bridge

volumes:
  opensearch-data:
  prometheus-data:
  grafana-data:
