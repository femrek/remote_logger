services:
  logger_gateway:
    image: ghcr.io/femrek/logger_gateway:latest
    hostname: logger_gateway
    environment:
      - CONSUL_HTTP_ADDR=http://consul:8500
      - RUST_LOG=${RUST_LOG:-info,logger_gateway=debug}
      - GATEWAY_PUBLIC_KEY_PATH=${GATEWAY_PUBLIC_KEY_PATH:-/etc/logger/keys/public.pem}
      - GATEWAY_BIND_ADDR=${GATEWAY_BIND_ADDR:-0.0.0.0:8080}
      - GATEWAY_METRICS_ADDR=${GATEWAY_METRICS_ADDR:-0.0.0.0:9090}
      # Uncomment to enable TLS termination:
      # - GATEWAY_TLS_CERT_PATH=/etc/certs/server.crt
      # - GATEWAY_TLS_KEY_PATH=/etc/certs/server.key
    volumes:
      - ./keys/public.pem:/etc/logger/keys/public.pem:ro
    networks:
      - logger_network
    depends_on:
      consul:
        condition: service_healthy

  logger_admin:
    image: ghcr.io/femrek/logger_admin:latest
    hostname: logger_admin
    environment:
      - CONSUL_HTTP_ADDR=http://consul:8500
      - PORT=8082
      - ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN}
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - logger_network
    depends_on:
      consul:
        condition: service_healthy

  validation_worker:
    image: ghcr.io/femrek/validation_worker:latest
    deploy:
      replicas: 2
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-broker:9094}
      - PORT=${PORT:-8000}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-mobile-logs}
      - KAFKA_METADATA_TOPIC=${KAFKA_METADATA_TOPIC:-device-metadata}
      - GATEWAY_PRIVATE_KEY_PATH=${GATEWAY_PRIVATE_KEY_PATH:-/etc/logger/keys/private.pem}
      - ACCESS_JWT_TTL_SECONDS=${ACCESS_JWT_TTL_SECONDS:-900}
      - REFRESH_JWT_TTL_SECONDS=${REFRESH_JWT_TTL_SECONDS:-604800}
      - JWT_ISSUER=${JWT_ISSUER:-logger-gateway}
      - RUST_LOG=${RUST_LOG:-info,validation_worker=debug}
      - METRICS_PORT=9091
      - CONSUL_HTTP_ADDR=http://consul:8500
      - ADVERTISED_IP=auto
      - NODE_ID=auto
    volumes:
      - ./keys/private.pem:/etc/logger/keys/private.pem:ro
    networks:
      - logger_network
    depends_on:
      broker:
        condition: service_started
      consul:
        condition: service_healthy

  broker:
    image: apache/kafka:4.3.0
    hostname: logger_broker
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_BROKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_BROKER://broker:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_BROKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: 4L62xNx5ScCm95V306Y2tQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - logger_network

  fluent-bit:
    image: fluent/fluent-bit:latest
    hostname: logger_fluentbit
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    environment:
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    depends_on:
      - broker
      - opensearch
    networks:
      - logger_network

  opensearch:
    image: opensearchproject/opensearch:latest
    hostname: logger_opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - plugins.security.ssl.http.enabled=false
      - plugins.security.ssl.transport.enabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - logger_network
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    hostname: logger_opensearch_dashboard
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    networks:
      - logger_network
    depends_on:
      - opensearch

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: logger_kafka_ui
    depends_on:
      - broker
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:9094
    networks:
      - logger_network

  consul:
    image: hashicorp/consul:1.15
    hostname: logger_consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    volumes:
      - consul-data:/consul/data
    networks:
      - logger_network

  # ── Monitoring stack ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    hostname: logger_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - logger_network
    depends_on:
      - logger_gateway
      - validation_worker
      - kafka-exporter
      - opensearch-exporter
      - consul-exporter

  grafana:
    image: grafana/grafana:11.0.0
    hostname: logger_grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    networks:
      - logger_network
    depends_on:
      - prometheus

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    hostname: logger_kafka_exporter
    command:
      - '--kafka.server=broker:9094'
    networks:
      - logger_network
    restart: on-failure
    depends_on:
      - broker

  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    hostname: logger_exporter
    command:
      - '--es.uri=http://admin:${OPENSEARCH_ADMIN_PASSWORD}@opensearch:9200'
      - '--es.all'
      - '--es.indices'
    networks:
      - logger_network
    restart: on-failure
    depends_on:
      - opensearch

  consul-exporter:
    image: prom/consul-exporter:latest
    hostname: logger_consul_exporter
    command:
      - '--consul.server=consul:8500'
    networks:
      - logger_network
    depends_on:
      consul:
        condition: service_healthy

networks:
  logger_network:
    driver: bridge

volumes:
  opensearch-data:
  prometheus-data:
  grafana-data:
  consul-data:
