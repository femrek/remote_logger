services:
  gateway:
    image: logger-gateway:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logger-gateway
    ports:
      - "8080:8080"  # Proxy bind port
      - "9090:9090"  # Prometheus metrics port
    environment:
      - RUST_LOG=${RUST_LOG:-info,logger_gateway=debug}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
    volumes:
      # Mount the gateway.yaml file so that modifying it on the host triggers the hot-reload watcher in the container.
      - ../config/gateway.yaml:/app/config/gateway.yaml
      - ../config/workers_list.json:/app/config/workers_list.json
    restart: unless-stopped
