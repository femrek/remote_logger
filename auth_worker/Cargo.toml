[package]
name = "auth_worker"
version = "0.1.0"
edition = "2024"

[lib]
name = "auth_worker"
path = "src/lib.rs"

[[bin]]
name = "auth_worker"
path = "src/main.rs"

# ── Production dependencies ───────────────────────────────────────────────────
[dependencies]
axum              = "0.7"
tokio             = { version = "1.36", features = ["full"] }
serde             = { version = "1.0",  features = ["derive"] }
serde_json        = "1.0"
rdkafka           = { version = "0.36", features = ["cmake-build"] }
http              = "1.0"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Auth & crypto ─────────────────────────────────────────────────────────────
jsonwebtoken = "9"
chrono       = { version = "0.4", features = ["serde"] }
sha2         = "0.10"
hex          = "0.4"
uuid         = { version = "1", features = ["v4"] }
thiserror    = "1"
base64       = "0.22"
ring         = "0.17"

# ── Hot-reload config & Discovery ─────────────────────────────────────────────
arc-swap   = "1"
anyhow     = "1"
async-trait = "0.1"
prometheus  = "0.13"
lazy_static = "1"
reqwest = { version = "0.12", features = ["json"] }

# ── Test-only dependencies ────────────────────────────────────────────────────
[dev-dependencies]
tower          = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
