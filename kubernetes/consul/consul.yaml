apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: logger-backend
  labels:
    app: consul
spec:
  ports:
    - name: http
      port: 8500
      targetPort: 8500
    - name: dns
      port: 8600
      targetPort: 8600
  selector:
    app: consul

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: logger-backend
  labels:
    app: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.15
          args:
            - "agent"
            - "-server"
            - "-ui"
            - "-node=server-1"
            - "-bootstrap-expect=1"
            - "-client=0.0.0.0"
          ports:
            - containerPort: 8500
              name: http
            - containerPort: 8600
              name: dns
          readinessProbe:
            httpGet:
              path: /v1/status/leader
              port: 8500
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/status/leader
              port: 8500
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
