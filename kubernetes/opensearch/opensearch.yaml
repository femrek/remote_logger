apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: logger-backend
  labels:
    app: opensearch
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 9200
  selector:
    app: opensearch

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: logger-backend
  labels:
    app: opensearch
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:latest
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            # discovery.type cannot be set as a Kubernetes env var (dot is invalid).
            # Pass it as a JVM system property via OPENSEARCH_JAVA_OPTS instead.
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m -Ddiscovery.type=single-node"
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: opensearch-data
          emptyDir: {}

  # For production, uncomment the following block and comment out the volumes: emptyDir section above:
  # volumeClaimTemplates:
  #   - metadata:
  #       name: opensearch-data
  #     spec:
  #       accessModes: [ "ReadWriteOnce" ]
  #       resources:
  #         requests:
  #           storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: logger-backend
  labels:
    app: opensearch-dashboards
spec:
  ports:
    - name: http
      port: 5601
      targetPort: 5601
  selector:
    app: opensearch-dashboards

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: logger-backend
  labels:
    app: opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:latest
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch:9200"]'
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
