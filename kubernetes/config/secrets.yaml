apiVersion: v1
kind: Secret
metadata:
  name: logger-secrets
  namespace: logger-backend
type: Opaque
data:
  # Base64 encoded value for: change-me-in-development
  # To generate a custom secret, run: echo -n "your-secret-key" | base64
  # Ensure it is identical on both logger-gateway and validation-worker.
  GATEWAY_JWT_SECRET: Y2hhbmdlLW1lLWluLWRldmVsb3BtZW50
