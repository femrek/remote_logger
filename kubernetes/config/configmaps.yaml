apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: logger-backend
data:
  gateway.yaml: |
    gateway:
      # TCP bind address for the proxy listener.
      bind_addr: "0.0.0.0:8080"

      # JWT session tokens
      jwt:
        secret_env:  "GATEWAY_JWT_SECRET"          # overrides `secret` when set
        ttl_seconds: 900                           # 15-minute access window (reference only)
        issuer:      "logger-gateway"

      # Hard upper bound on ingest request bodies (bytes).
      max_body_bytes: 2097152   # 2 MiB

      # Prometheus /metrics scrape endpoint.
      metrics_addr: "0.0.0.0:9090"

    # Per-channel routing table
    channels:
      - id: "example-app-prod"
        path_prefix: "/v1/logs/example-app-prod"
        app_id: "dev.femrek.exampleapp"

      - id: "example-app-dev"
        path_prefix: "/v1/logs/example-app-dev"
        app_id: "dev.femrek.exampleapp.dev"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-worker-config
  namespace: logger-backend
data:
  channels.yaml: |
    channels:
      # Production channel
      - id: "example-app-prod"
        app_id: "dev.femrek.exampleapp"
        android_attestation_mode: "enforce"
        ios_attestation_mode: "enforce"
        apple_team_id: "STUBTEAMID"
        apple_app_attest_env: "production"
        # Optional: restrict Android Key Attestation to specific APK signing cert SHA-256 digests
        android_signing_cert_sha256: []

      # Local development / CI channel
      - id: "example-app-dev"
        app_id: "dev.femrek.exampleapp.dev"
        android_attestation_mode: "off"
        ios_attestation_mode: "off"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logger-backend
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         2
        Log_Level     info
        Daemon        off
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # --- FIRST TOPIC ---
    [INPUT]
        Name          kafka
        Brokers       broker:9094
        Topics        mobile-logs
        Group_Id      fluentbit-mobile-group
        Tag           mobile.logs
        Format        json
        rdkafka.topic.metadata.refresh.interval.ms  5000
        rdkafka.metadata.max.age.ms                 5000
        rdkafka.auto.offset.reset                   earliest

    # --- SECOND TOPIC ---
    [INPUT]
        Name          kafka
        Brokers       broker:9094
        Topics        device-metadata
        Group_Id      fluentbit-web-group
        Tag           device.metadata
        Format        json
        rdkafka.topic.metadata.refresh.interval.ms  5000
        rdkafka.metadata.max.age.ms                 5000
        rdkafka.auto.offset.reset                   earliest

    [FILTER]
        Name          nest
        Match         *
        Operation     lift
        Nested_under  payload

    [OUTPUT]
        Name          opensearch
        Match         *
        Host          opensearch
        Port          9200
        HTTP_User     admin
        HTTP_Passwd   ${OPENSEARCH_ADMIN_PASSWORD}
        Logstash_Format     On
        Logstash_Prefix_Key  log_index_prefix
        Suppress_Type_Name On
        Write_Operation create
        tls           Off
