apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: logger-backend
  labels:
    app: fluent-bit
spec:
  ports:
    - name: http
      port: 2020
      targetPort: 2020
  selector:
    app: fluent-bit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
  namespace: logger-backend
  labels:
    app: fluent-bit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:latest
          ports:
            - containerPort: 2020
              name: http
          env:
            - name: OPENSEARCH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: OPENSEARCH_ADMIN_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
