apiVersion: v1
kind: Service
metadata:
  name: logger-gateway
  namespace: logger-backend
  labels:
    app: logger-gateway
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: logger-gateway

---
apiVersion: v1
kind: Service
metadata:
  name: logger-gateway-metrics
  namespace: logger-backend
  labels:
    app: logger-gateway
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: logger-gateway

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-gateway
  namespace: logger-backend
  labels:
    app: logger-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-gateway
  template:
    metadata:
      labels:
        app: logger-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
        prometheus.io/path:   "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: logger-gateway
          image: ghcr.io/femrek/logger_gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: CONSUL_HTTP_ADDR
              value: "http://consul.logger-backend.svc.cluster.local:8500"
            - name: RUST_LOG
              value: "info,logger_gateway=debug"
            - name: GATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: logger-secrets
                  key: GATEWAY_JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/gateway.yaml
              subPath: gateway.yaml
      volumes:
        - name: config-volume
          configMap:
            name: gateway-config
