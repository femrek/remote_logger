apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-exporter
  namespace: monitoring
  labels:
    app: opensearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-exporter
  template:
    metadata:
      labels:
        app: opensearch-exporter
    spec:
      containers:
        - name: opensearch-exporter
          # The Elasticsearch exporter is fully compatible with OpenSearch's
          # REST API (_cluster/health, _stats, _nodes/stats, etc.).
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
          args:
            - '--es.uri=http://opensearch.logger-backend.svc.cluster.local:9200'
            - '--es.all'
            - '--es.indices'
            - '--es.cluster_settings'
          ports:
            - containerPort: 9114
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9114
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-exporter
  namespace: monitoring
  labels:
    app: opensearch-exporter
spec:
  type: ClusterIP
  selector:
    app: opensearch-exporter
  ports:
    - name: metrics
      port: 9114
      targetPort: 9114
