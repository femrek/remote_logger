channels:
  # ── Production channel ────────────────────────────────────────────────────────
  # android_attestation_mode / ios_attestation_mode: "enforce" requires hardware
  # key attestation (Android Keystore X.509 chain / Apple App Attest or Secure Enclave).
  - id: "example-app-prod"
    app_id: "dev.femrek.exampleapp"
    android_attestation_mode: "enforce"
    ios_attestation_mode: "enforce"
    apple_team_id: "STUBTEAMID"
    apple_app_attest_env: "production"
    # Optional: list of allowed APK signing certificate SHA-256 hex digests
    android_signing_cert_sha256: []

  # ── Local development / CI channel ────────────────────────────────────────────
  # Attestation is disabled ("off") so tests and emulators/simulators can
  # exchange tokens without hardware attestation.
  - id: "example-app-dev"
    app_id: "dev.femrek.exampleapp.dev"
    android_attestation_mode: "off"
    ios_attestation_mode: "off"
