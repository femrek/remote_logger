name: flutter_remote_logging
description: "The flutter expansion of the remote_logging package to send logs to a self hosted remote server."
version: 0.0.1
homepage: https://github.com/femrek/remote_logger/tree/main/mobile/flutter_remote_logging
repository: https://github.com/femrek/remote_logger
issue_tracker: https://github.com/femrek/remote_logger/issues

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  device_info_plus: ">=9.0.0 <14.0.0"
  flutter:
    sdk: flutter
  package_info_plus: ">=4.0.0 <11.0.0"
  path: ">=1.8.0 <2.0.0"
  path_provider: ">=2.0.0 <3.0.0"
  remote_logging: ">=0.0.1 <1.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  sqflite: ">=2.0.0 <3.0.0"
  uuid: ">=3.0.0 <5.0.0"

dev_dependencies:
  device_info_plus_platform_interface: ^8.1.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.2
  very_good_analysis: ^10.3.0

dependency_overrides:
  remote_logging:
    path: ../remote_logging

flutter:
